# keel's tests on the three systems it supports, on every push and pull request. The repository is public, so the
# minutes are free; every job has a time limit so a hang cannot run on.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Run the tests on scratch repositories
        run: python -I -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: keel's own gate over every tracked file
        run: python -I scripts/keel.py gate --all
      - name: keel's own budget and doctor
        run: |
          python -I scripts/keel.py budget
          python -I scripts/keel.py doctor --no-memory || true
