# bowline's tests on the three systems it supports, on every push and pull request. The repository is public, so the
# minutes are free; every job has a time limit so a hang cannot run on.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.8"
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.8 is the oldest Python bowline supports and runs on the Windows and macOS runners; the Linux runner's
          # image no longer offers 3.8, so it runs a newer one.
          python-version: ${{ matrix.python }}
      # The runners have Node installed, so the tests of the plugin's Node launcher run on all three systems.
      - name: Run the tests on scratch repositories
        run: python -I -m unittest discover -s tests -p "test_*.py" -v
      - name: bowline's own gate over every tracked file
        run: python -I plugin/scripts/bowline.py gate --all
      - name: bowline's own budget and doctor
        run: |
          python -I plugin/scripts/bowline.py budget
          python -I plugin/scripts/bowline.py doctor --no-memory || true
